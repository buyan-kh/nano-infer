name: ci

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU PyTorch and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "fastapi>=0.115" "uvicorn>=0.32" "pydantic>=2" "tiktoken>=0.7" "numpy>=1.26" "huggingface_hub>=0.26" "safetensors>=0.4" "pytest>=8" "httpx>=0.27"
          pip install "transformers>=4.46" --no-deps
          pip install tokenizers regex tqdm pyyaml requests packaging filelock
          pip install -e . --no-deps
      - name: Test
        run: python -m pytest tests -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
