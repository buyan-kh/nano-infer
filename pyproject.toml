[project]
name = "nano-infer"
version = "0.1.0"
description = "From-scratch decoder-only inference server with paged KV cache and continuous batching."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.2",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pydantic>=2",
  "tiktoken>=0.7",
  "numpy>=1.26",
  "huggingface_hub>=0.26",
  "safetensors>=0.4",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
  "httpx>=0.27",
  "transformers>=4.46",
]

[project.scripts]
nano-infer = "nano_infer.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nano_infer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
